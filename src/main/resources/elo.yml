# ========================================================
#                  VTCORE ELO & RANKED SYSTEM
# ========================================================

# Temel ELO Ayarlari
elo:
  default: 1000 

  # Minimum ELO siniri (oyuncular bu elonun altina dusemez)
  min-elo: 500

  # Hesaplama ayarlari
  calculation:
    base-gain: 25
    base-loss: 35

    # ELO farki buysa "Buyuk Fark" kurallari isler
    difference-threshold: 300

    big-difference:
      # Dusuk ELO, yuksek ELO'yu yenerse (gain = fark * katsayi)
      low-wins-multiplier: 0.10
      # Yuksek ELO, dusuk ELO'yu yenerse (gain = base_gain * multiplier)
      high-wins-multiplier: 0.70
      # Kaybetme
      high-loses-multiplier: 1.3
      low-loses-multiplier: 0.5
    # Üst Lig (2200+ ELO) Zorluk Ayarları
    upper-league:
      # Üst ligdeyken ELO kazanırken bu çarpan uygulanır (Kazanmayı zorlaştırır)
      gain-multiplier: 0.6
      # Üst ligdeyken ELO kaybederken bu çarpan uygulanır (Kaybetmeyi kolaylaştırır)
      loss-multiplier: 1.4


