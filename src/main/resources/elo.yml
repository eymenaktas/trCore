# Ranked Queue Ayarlari
ranked-queue:
  command: ""
  timeout-seconds: 96
  min-range: 100
  max-range: 6000

  worlds:
    - sand
    - plains
    - snow
    - mushroom
    - badlands
  requirements:
    enabled: true
    conditions:
      - placeholder: "%statistic_player_kills%"
        min: 20

  escape:
    enabled: true
    max-distance: 150.0
    warning-message: "&8&l➜&r <red>Dereceli maçtan kaçamazsın! Uyarı (%strike%/3)"
    teleport-message: "&8&l➜&r <red>Çok uzaklaştın, geri ışınlandın!"
    warning-sound: "ENTITY_ENDERMAN_TELEPORT"

# Streak Sistemi
streak-system:
  enabled: true
  min-streak-for-bonus: 4
  bonus-per-win: 0.1
  loss-protection-streak: 4

# Lig Ayarları
leagues:
  middle:
    enabled: true
    min-elo: 1000
    totem-limit: 14
  upper:
    enabled: true
    min-elo: 1800
    totem-limit: 8
  master:
    enabled: true
    min-elo: 2300
    totem-limit: 4

# Mesajlar ve Sesler
messages:
  lowest-queue-joined: "<gray>Düşük Lig sırasına katıldın! [%current% kişi bekliyor]"
  lower-queue-joined: "<green>Orta Lig sırasına katıldın! <gray>[%current% kişi bekliyor]"
  upper-queue-joined: "<light_purple>Yüksek Lig sırasına katıldın! <gray>[%current% kişi bekliyor]"
  queue-left: "&8&l➜&r <gray>Sıradan çıktın."
  queue-timeout: "&8&l➜&r <#d1c42e>Sırada uzun süre beklediğin için sıran temizlendi."
  queue-matched: "&8&l➜&r <green>Rakip bulundu! Işınlanıyorsun..."
  queue-requirements-failed: "&8&l➜&r <red>Dereceli sıraya girmek için 20 öldürme sayısına ulaşmalısın!"
  not-visible: ""

# Yeni Eşleşme Bildirimleri ve Geri Sayım
matchmaking-notifications:
  countdown-seconds: 3
  leagues:
    lowest:
      title: "<green>Eşleşme Bulundu!"
      subtitle: "<gray>Bölge: %world% | Başlıyor: <white>%time%"
    middle:
      title: "<green>Eşleşme Bulundu!"
      subtitle: "<gray>Bölge: %world% | Başlıyor: <white>%time%"
    upper:
      title: "<light_purple>Eşleşme Bulundu!"
      subtitle: "<gray>Bölge: %world% | Başlıyor: <white>%time%"
    master:
      title: "<gold><bold>Eşleşme Bulundu!"
      subtitle: "<gray>Bölge: %world% | Başlıyor: <white>%time%"
  sounds:
    match-found: "ENTITY_EXPERIENCE_ORB_PICKUP"
    countdown: "BLOCK_NOTE_BLOCK_PLING"

# Maç Başladığında Gösterilecek Bildirim
match-start-notification:
  title: "<green><bold>MAÇ BAŞLADI"
  subtitle: "<white>Rakibini yen ve ELO kazan! Bol şans."
  sound: "ENTITY_PLAYER_LEVELUP"

# Ranked Bölge Koruması
# Başka oyuncuların ranked alanına girmesini engeller
protection:
  enabled: true
  message: "&8&l➜&r <red>Burada dereceli maç oynanıyor! Başka yere gitmelisin."

sounds:
  queue-join: "BLOCK_NOTE_BLOCK_PLING"
  queue-error: "ENTITY_VILLAGER_NO"
  queue-match: "ENTITY_PLAYER_LEVELUP"

# Ranked esnasinda komut kisitlamasi
match-commands:
  enabled: true
  allowed:
    - "/msg"
    - "/r"
    - "/reply"
  blocked-message: "&8&l➜&r <red>Dereceli maçtayken sadece belirli komutlari kullanabilirsin!"

anti-abuse:
  # Ayni IP adresinden giren kisiler ELO alamaz/kaybedemez
  block-same-ip: true
  # Oyuncular ust uste oynarsa verilecek ceza (Dakika)
  match-cooldown:
    enabled: true
    cooldown-minutes: 10
    # Cooldown suresi icinde atilan macta verilecek MAX elo
    max-gain: 5

smart-elo:
  enabled: true
  multiplier-impact: 0.2
  multiplier:
    min: 0.85
    max: 1.25
  tolerance:
    small-diff-threshold: 0.06
  duration:
    full-score-seconds: 180
  max-extra-gain: 12
  max-extra-loss: 12
  weights:
    damage: 0.45
    crystal: 0.20
    anchor: 0.15
    totem: 0.15
    duration: 0.05

ranked-history:
  enabled: true
  expire-seconds: 600
  max-stored-matches-per-player: 20
  match-summary-click: "<yellow>Mac ozeti icin tikla <gray>(%match_uuid%)"
  match-summary-hover: "<gray>Gecmis UUID: <white>%match_uuid%</white>"

# Sıradayken (Queue) komut kısıtlaması
queue-commands:
  enabled: true
  allowed:
    - "/rankedqueue"
    - "/rtpranked"
    - "/rq"
    - "/msg"
    - "/r"
  blocked-message: "<red>Sıradayken sadece belirli komutları kullanabilirsin! Sıradan çıkmak için: <white>/rankedqueue"

# Ranked Eşya ve İksir Kısıtlamaları
restrictions:
  enabled: true
  # Yasaklı eşyalar (Material isimleri)
  blacklisted-items:
    - "ENDER_CHEST"
  # Yasaklı iksir efektleri (PotionEffectType isimleri)
  blacklisted-potions:
    - "TURTLE_MASTER" # Strength
    - "WEAKNESS"        # Weakness
