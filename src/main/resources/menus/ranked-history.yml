# Maç izleme menüsü — Exylia menü dili: smallcaps başlık, "▎" ile girintili
# satırlar, "»" ayracı ve tek bir vurgu rengi.

list:
  title: "<!italic><dark_gray>ᴍᴀç ɢᴇçᴍɪşɪ <#4a5a6a>[%page%/%max_page%]"
  items:
    win:
      material: "LIME_DYE"
    loss:
      material: "RED_DYE"
    name: "<!italic><#8ccefe>&l%opponent% <#4a5a6a>» <white>%match_short%"
    lore:
      - "<!italic>&f"
      - "<!italic><#4a5a6a>▎ <#a8c6dd>Süre <#4a5a6a>» <white>%duration%s"
      - "<!italic><#4a5a6a>▎ <#a8c6dd>ELO <#4a5a6a>» <white>%elo_change%"
      - "<!italic>&f"
      - "<!italic><#8ccefe>➥ Maç özetini açmak için tıkla"
  previous:
    material: "ARROW"
    name: "<!italic><#8ccefe>← öɴᴄᴇᴋɪ ꜱᴀʏꜰᴀ"
  next:
    material: "ARROW"
    name: "<!italic><#8ccefe>ꜱᴏɴʀᴀᴋɪ ꜱᴀʏꜰᴀ →"

detail:
  title: "<!italic><dark_gray>ᴍᴀç öᴢᴇᴛɪ"
  center:
    material: "CLOCK"
    name: "<!italic><#8ccefe>&lɢᴇɴᴇʟ ʙɪʟɢɪ"
    lore:
      - "<!italic>&f"
      - "<!italic><#4a5a6a>▎ <#a8c6dd>Süre <#4a5a6a>» <white>%duration%s"
      - "<!italic><#4a5a6a>▎ <#a8c6dd>Maç <#4a5a6a>» <#4a5a6a>%match_uuid%"
  item-lore:
    - "<!italic>&f"
    - "<!italic><#4a5a6a>▎ <#a8c6dd>Oyuncu <#4a5a6a>» <white>%name%"
    - "<!italic><#4a5a6a>▎ <#a8c6dd>Rütbe <#4a5a6a>» %rank%"
    - "<!italic><#4a5a6a>▎ <#a8c6dd>ELO <#4a5a6a>» <white>%elo% <#4a5a6a>(<white>%elo_change%<#4a5a6a>)"
    - "<!italic>&f"
    - "<!italic><#4a5a6a>▎ <#a8c6dd>Kalan can <#4a5a6a>» <white>%health%"
    - "<!italic><#4a5a6a>▎ <#a8c6dd>Toplam hasar <#4a5a6a>» <white>%damage%"
    - "<!italic><#4a5a6a>▎ <#a8c6dd>Totem <#4a5a6a>» <white>%totem%"
    - "<!italic><#4a5a6a>▎ <#a8c6dd>Kristal <#4a5a6a>» <white>%crystal%"
    - "<!italic><#4a5a6a>▎ <#a8c6dd>Anchor <#4a5a6a>» <white>%anchor%"
    - "<!italic>&f"
    - "<!italic><#8ccefe>➥ Envanteri görmek için tıkla"
  items:
    name:
      material: "PLAYER_HEAD"
      name: "<!italic><#8ccefe>&l%name%"
      lore:
        - "<!italic>&f"
    elo:
      material: "GOLD_INGOT"
      name: "<!italic><#8ccefe>&lᴇʟᴏ"
      lore:
        - "<!italic>&f"
        - "<!italic><#4a5a6a>▎ <#a8c6dd>Güncel <#4a5a6a>» <white>%elo%"
        - "<!italic><#4a5a6a>▎ <#a8c6dd>Değişim <#4a5a6a>» <white>%elo_change%"
    rank:
      material: "NETHER_STAR"
      name: "<!italic><#8ccefe>&lʀüᴛʙᴇ"
      lore:
        - "<!italic>&f"
        - "<!italic><#4a5a6a>▎ %rank%"
    health:
      material: "APPLE"
      name: "<!italic><#8ccefe>&lᴋᴀʟᴀɴ ᴄᴀɴ"
      lore:
        - "<!italic>&f"
        - "<!italic><#4a5a6a>▎ <white>%health%"
    totem:
      material: "TOTEM_OF_UNDYING"
      name: "<!italic><#8ccefe>&lᴘᴀᴛʟᴀʏᴀɴ ᴛᴏᴛᴇᴍ"
      lore:
        - "<!italic>&f"
        - "<!italic><#4a5a6a>▎ <white>%totem%"
    crystal:
      material: "END_CRYSTAL"
      name: "<!italic><#8ccefe>&lᴘᴀᴛʟᴀᴛıʟᴀɴ ᴋʀɪꜱᴛᴀʟ"
      lore:
        - "<!italic>&f"
        - "<!italic><#4a5a6a>▎ <white>%crystal%"
    anchor:
      material: "RESPAWN_ANCHOR"
      name: "<!italic><#8ccefe>&lᴘᴀᴛʟᴀᴛıʟᴀɴ ᴀɴᴄʜᴏʀ"
      lore:
        - "<!italic>&f"
        - "<!italic><#4a5a6a>▎ <white>%anchor%"
    damage:
      material: "IRON_SWORD"
      name: "<!italic><#8ccefe>&lᴀʟıɴᴀɴ ʜᴀꜱᴀʀ"
      lore:
        - "<!italic>&f"
        - "<!italic><#4a5a6a>▎ <white>%damage%"
    inventory:
      material: "CHEST"
      name: "<!italic><#8ccefe>&lᴇɴᴠᴀɴᴛᴇʀ"
      lore:
        - "<!italic>&f"
        - "<!italic><#4a5a6a>▎ <#a8c6dd>%name% <#4a5a6a>oyuncusunun envanteri"
        - "<!italic>&f"
        - "<!italic><#8ccefe>➥ Açmak için tıkla"

inventory:
  title: "<!italic><dark_gray>%player% <#4a5a6a>» <#8ccefe>ᴇɴᴠᴀɴᴛᴇʀ"
