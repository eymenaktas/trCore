name: ioCore
version: "1.0"
main: com.trcore.TRCore
description: CPvP.io practice core
api-version: "1.21"
folia-supported: true
authors:
  - MaskeDev

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: true
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    EcstacyAC-Spigot:
      load: BEFORE
      required: false
      join-classpath: true
    ExyliaKillEffect:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  iocore.trim:
    description: /trim komutunu kullanabilir (armortrimer.use ile ayni).
    default: false
  armortrimer.use:
    description: Eski isim; iocore.trim ile ayni isi yapar.
    default: false
  trcore.cooldown.bypass:
    description: Komut bekleme surelerinden etkilenmez.
    default: op

  iocore.punish:
    description: /iopunish komutunu kullanabilir.
    default: false
  iocore.punish.sohbet:
    description: Sohbet sebepleriyle ceza verebilir (kufur, spam, reklam, tehdit).
    default: false
  iocore.punish.oyun:
    description: Oyun sebepleriyle ceza verebilir (troll, bug, isim).
    default: false
  iocore.punish.hile:
    description: Hile sebebiyle ceza verebilir.
    default: false
  iocore.punish.kademe:
    description: Ceza kademesini elle secebilir.
    default: op
  iocore.punish.reload:
    description: cezalar.yml dosyasini yeniden yukleyebilir.
    default: op
  iocore.punish.muaf:
    description: /iopunish ile cezalandirilamaz.
    default: false
  iocore.punish.muafbypass:
    description: Muaf oyunculara da ceza verebilir.
    default: op

commands:
  iopunish:
    description: Sebebe bagli otomatik ceza.
    aliases: [ceza, punish]
  tpaccept:
    description: TPA istegini kabul eder.
    aliases: [tpyes, tpkabul]
  tpdeny:
    description: TPA istegini reddeder.
    aliases: [tpno, tpred]
  tpauto:
    description: Otomatik kabul
    aliases: [tpaauto]
  tpahere:
    description: Oyuncuyu yaniniza cagirir.
    aliases: [tpyanina]
  trcore:
    description: Admin komutu
  tpa:
    description: TPA İsteği atar
  tpaevent:
    description: TPA Etkinliği komutu
  taptal:
    description: TPA iptal
  rtpduel:
    description: RTP Düello komutu
  trim:
    description: Trim Menüsü
  toggle:
    description: İstek kapatma yöneticisi
  Spawn:
    description: Spawn komutu
  setspawn:
    description: Set Spawn
  clearchat:
    description: Chat temiszler
    aliases: [cc]
  gmc:
    description: Creative
  gms:
    description: Survival
  gmsp:
    description: Spectator
  disguise:
    description: Sahte isim alma
    aliases: [nick]
  rankedhistory:
    description: Ranked mac gecmisini gosterir
    aliases: [rh]
